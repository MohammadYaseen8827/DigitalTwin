# Backup Configuration File
# Digital Twin Platform Backup System

# === Basic Configuration ===
BACKUP_ROOT="/backups"
RETENTION_DAYS=30
LOG_LEVEL="INFO"

# === Database Configuration ===
DB_HOST="postgres"
DB_PORT="5432"
DB_NAME="digitaltwin"
DB_USER="digitaltwin"
DB_PASSWORD="your_db_password_here"

# === AWS Configuration ===
AWS_ACCESS_KEY_ID="your_access_key_here"
AWS_SECRET_ACCESS_KEY="your_secret_key_here"
AWS_BUCKET="digitaltwin-backups"
AWS_REGION="us-west-2"

# === Encryption Configuration ===
# Leave empty to disable encryption
ENCRYPTION_KEY=""
# ENCRYPTION_KEY="your_encryption_password_here"

# === Notification Configuration ===
SLACK_WEBHOOK=""
EMAIL_ALERTS="admin@company.com"
NOTIFICATION_ENABLED=true

# === Backup Schedules ===
# Format: minute hour day month weekday
FULL_BACKUP_SCHEDULE="0 2 * * *"      # Daily at 2 AM
INCREMENTAL_BACKUP_SCHEDULE="*/15 * * * *"  # Every 15 minutes
FILESYSTEM_BACKUP_SCHEDULE="0 3 * * *"     # Daily at 3 AM

# === Backup Components ===
BACKUP_DATABASE=true
BACKUP_APPLICATION=true
BACKUP_FILESYSTEM=true
BACKUP_LOGS=true

# === Storage Configuration ===
LOCAL_STORAGE_LIMIT="50G"  # Local storage limit
CLOUD_STORAGE_CLASS="STANDARD_IA"  # S3 storage class

# === Recovery Configuration ===
RECOVERY_TEST_SCHEDULE="0 4 * * 0"  # Weekly on Sundays at 4 AM
AUTO_RECOVERY=false

# === Monitoring ===
HEALTH_CHECK_ENDPOINT="http://localhost:8080/health"
METRICS_ENDPOINT="http://localhost:9090/metrics"

# === Security ===
BACKUP_USER="backup"
BACKUP_GROUP="backup"
PERMISSIONS="750"

# === Performance Tuning ===
COMPRESSION_LEVEL=6  # 1-9, 6 is default
PARALLEL_JOBS=4      # Number of parallel backup jobs
BUFFER_SIZE="16MB"   # Buffer size for database backups

# === Validation ===
VALIDATE_BACKUPS=true
VALIDATION_SCHEDULE="30 2 * * *"  # Daily at 2:30 AM

# === Environment Specific Overrides ===
case "${ENVIRONMENT:-production}" in
    "development")
        RETENTION_DAYS=7
        BACKUP_SCHEDULE="0 */6 * * *"  # Every 6 hours
        ;;
    "staging")
        RETENTION_DAYS=14
        BACKUP_SCHEDULE="0 1,13 * * *"  # Twice daily
        ;;
    "production")
        RETENTION_DAYS=30
        BACKUP_SCHEDULE="0 2 * * *"    # Daily
        ;;
esac

# === Custom Paths ===
DOCKER_COMPOSE_FILE="/app/docker-compose.yml"
APPLICATION_PATH="/app/src"
CONFIG_PATH="/app/config"

# === Exclusions ===
EXCLUDE_PATTERNS=(
    "*.tmp"
    "*.log"
    "cache/*"
    "tmp/*"
)

# === Advanced Options ===
ENABLE_INCREMENTAL=true
ENABLE_COMPRESSION=true
ENABLE_ENCRYPTION=false
ENABLE_VERIFICATION=true

# === Logging ===
LOG_FORMAT="json"
LOG_ROTATION_DAYS=7
LOG_COMPRESSION=true

# === Export variables for use in scripts ===
export BACKUP_ROOT
export DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD
export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET AWS_REGION
export ENCRYPTION_KEY
export SLACK_WEBHOOK