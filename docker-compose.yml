services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: digitaltwin_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - digitaltwin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_service
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - digitaltwin-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=digitaltwin_db;Username=admin;Password=password;
    ports:
      - "5000:80"
    networks:
      - digitaltwin-network

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: ui_service
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - digitaltwin-network

  shap-service:
    build:
      context: ./services/shap-service
      dockerfile: Dockerfile
    container_name: shap_service
    ports:
      - "5001:5000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - PORT=5000
    networks:
      - digitaltwin-network

volumes:
  pgdata:

networks:
  digitaltwin-network:
    driver: bridge